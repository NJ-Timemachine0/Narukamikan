<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="author" content="Timemachine0">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:,">
<link rel="preload" href="fonts/ShipporiMincho-Regular-nk.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/EBGaramond-Regular-nk.woff2" as="font" type="font/woff2" crossorigin>
<title>Narukami Hall: Ring Once, Then Listen</title>
<style>
/* Fonts: subsets of Shippori Mincho and EB Garamond (SIL OFL 1.1, full texts in fonts/OFL-*.txt). tools/subset_fonts.py */
@font-face{font-family:"NK Mincho";src:url(fonts/ShipporiMincho-Regular-nk.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"NK Mincho";src:url(fonts/ShipporiMincho-Bold-nk.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"NK Garamond";src:url(fonts/EBGaramond-Regular-nk.woff2) format("woff2");font-weight:400;font-display:swap}
:root{--ic:56px;--labfs:max(12px,min(2.6vmin,15px));--lab:calc(var(--labfs) * 2.6);--enfs:max(18px,min(4.2vmin,28px));
  --hb-ja:max(10px,2.5vh,env(safe-area-inset-bottom));--howto-h:calc(var(--ic) + var(--lab));--sub-en-bottom:calc(var(--hb-ja) + var(--howto-h) + 8px)}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;color:#d8dbe2;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  touch-action:none;overscroll-behavior:none;font-family:"NK Mincho","NK Garamond","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Noto Serif CJK JP",Georgia,"Times New Roman",serif}
html[lang=en] body{font-family:"NK Garamond","NK Mincho",Georgia,"Times New Roman",serif}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
#start{position:fixed;inset:0;display:block;background:#000;z-index:5;transition:opacity .8s;overflow:hidden}
#start.hide{opacity:0;pointer-events:none;visibility:hidden}
/* opening (p04): inn picture C behind the title, loaded after the page (black + text until then) */
#startbg{position:absolute;inset:0;background:#000 center 46%/cover no-repeat;opacity:0;transition:opacity 1.5s ease-in}
#startbg.on{opacity:.62}
#startshade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.55) 0%,rgba(0,0,0,.15) 34%,rgba(0,0,0,.25) 60%,rgba(0,0,0,.75) 100%);pointer-events:none}
#oripple{position:absolute;border-radius:50%;border:1.5px solid rgba(220,228,240,1);box-shadow:0 0 18px rgba(200,212,235,.35),inset 0 0 18px rgba(200,212,235,.25);opacity:0;pointer-events:none}
#stitle{position:absolute;left:0;right:0;top:max(9vh,env(safe-area-inset-top));display:flex;flex-direction:column;align-items:center;gap:1.6vmin;padding:0 5vw;text-align:center}
#titlealt{font-family:"NK Garamond","NK Mincho",serif;font-size:max(12px,min(2.6vmin,15px));letter-spacing:.06em;color:#9aa0ad}
#titlealt:empty{display:none}
#genre{font-size:max(13px,min(3vmin,18px));line-height:1.6;color:#cfd3dc;letter-spacing:.04em;max-width:min(88vw,620px);margin-top:1.4vmin;text-shadow:0 0 8px #000}
html[lang=ja] #subtitle{font-family:"NK Mincho",serif;letter-spacing:.2em}
#smenu,#diffsel{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:stretch;gap:12px;width:min(78vw,340px)}
#diffsel{width:min(88vw,460px);gap:10px;display:none}
#start[data-state=diff] #diffsel,#start[data-state=hardnote] #diffsel{display:flex}
#start[data-state=diff] #smenu,#start[data-state=hardnote] #smenu,#start[data-state=diff] #stitle,#start[data-state=hardnote] #stitle{display:none}
#start[data-state=diff] #startbg.on,#start[data-state=hardnote] #startbg.on{opacity:.3}
#start[data-state=press] #smenu{opacity:.5;pointer-events:none}
.sbtn{appearance:none;font:inherit;font-size:max(16px,min(3.8vmin,22px));letter-spacing:.12em;color:#e4e6ec;background:rgba(0,0,0,.5);border:1px solid rgba(200,210,230,.35);border-radius:4px;padding:.65em 1em;cursor:pointer;text-align:center;line-height:1.4}
.sbtn:hover,.sbtn:focus-visible{border-color:rgba(200,210,230,.7);background:rgba(0,0,0,.65);outline:none}
.sbtn.off,.sbtn:disabled{opacity:.32;cursor:default;border-color:rgba(200,210,230,.15)}
html[lang=en] .sbtn{font-family:"NK Garamond","NK Mincho",serif;letter-spacing:.05em}
#diffhead{text-align:center;color:#9aa0ad;font-size:max(13px,min(2.8vmin,16px));letter-spacing:.12em;margin-bottom:4px}
.dbtn{display:flex;flex-direction:column;gap:.25em;padding:.6em 1em}
.dbtn .dl{font-size:1em}
.dbtn .dd{font-size:max(12px,min(2.5vmin,14px));letter-spacing:.03em;color:#aeb3bf;line-height:1.45}
.dbtn.sel{border-color:rgba(220,228,240,.85);background:rgba(20,22,28,.7)}
#hardnote{display:none;text-align:center;color:#e4e6ec;font-size:max(14px,min(3.2vmin,19px));line-height:1.6;margin-top:8px}
#start[data-state=hardnote] #hardnote{display:block}
#hardnote svg{width:1.4em;height:1.4em;vertical-align:-.35em;margin-right:.4em}
#start[data-state=hardnote] .dbtn{pointer-events:none;opacity:.45}
#start[data-state=hardnote] .dbtn.sel{opacity:1}
#phones{position:absolute;left:0;right:0;bottom:calc(max(14px,3vmin,env(safe-area-inset-bottom)) + 4.6em);display:flex;align-items:center;justify-content:center;gap:.5em;color:#cfd3dc;font-size:max(14px,min(3.2vmin,19px));letter-spacing:.06em;pointer-events:none}
#phones svg{width:1.6em;height:1.6em;flex:none}
#btn-credits{appearance:none;background:transparent;border:0;color:#7d828e;font:inherit;font-size:1em;letter-spacing:.08em;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:2px 8px;margin-top:.15em}
#credits{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.92);cursor:pointer;padding:6vh 7vw;box-sizing:border-box}
#credits.show{display:flex}
#creditslist{max-width:min(90vw,640px);max-height:80vh;overflow:auto;text-align:center;color:#cfd3dc;font-size:max(12px,min(2.6vmin,15px));line-height:1.75;letter-spacing:.03em}
#creditslist .ctitle{font-size:1.45em;color:#e6e8ee;margin-bottom:.7em;letter-spacing:.06em}
#creditslist .cgap{height:.8em}
#creditsclose{margin-top:1.2em;opacity:.6;font-size:.95em;text-decoration:underline;text-underline-offset:3px}
/* bell life (p04): corner icon, cracks by stage, never blinks; no numbers */
#bellui{position:fixed;left:max(10px,env(safe-area-inset-left));top:calc(max(10px,env(safe-area-inset-top)) + 46px);width:44px;height:44px;display:none;opacity:.72;z-index:4;pointer-events:none}
#bellui.show{display:block}
#bellui svg{width:100%;height:100%;display:block}
#bellui .ck1,#bellui .ck2,#bellui .ck3{display:none}
#bellui.bs1 .ck1,#bellui.bs2 .ck1,#bellui.bs2 .ck2,#bellui.bs3 .ck1,#bellui.bs3 .ck2,#bellui.bs3 .ck3{display:inline}
#bellui.bs3{opacity:.32}
#bellui .sr{transition:opacity .4s}
#bellui.nostrong .sr{opacity:.12}
#howto.nostrong .hi-hold:not(.used){opacity:.3}
#pausediff{position:absolute;left:50%;top:64%;transform:translateX(-50%);width:max-content;max-width:94vw;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:default}
#pausediffhead{color:#9aa0ad;font-size:max(12px,min(2.6vmin,15px));letter-spacing:.08em;text-align:center}
#pausediff .row{display:flex;gap:8px}
#pausediff .sbtn{font-size:max(13px,min(3vmin,17px));padding:.45em .7em;white-space:nowrap;letter-spacing:.06em}
#pausediff .sbtn.sel{border-color:rgba(220,228,240,.85)}
#credit{position:absolute;bottom:max(14px,3vmin,env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-family:"NK Mincho",serif;font-size:max(11px,min(2.4vmin,14px));letter-spacing:.06em;color:#7d828e;display:flex;flex-direction:column;gap:.35em;align-items:center;padding:0 6vw}
#credit .cline{max-width:100%}
#credit-art{font-family:"NK Garamond","NK Mincho",serif;letter-spacing:.04em;opacity:.9;font-size:.95em}
#title{font-size:min(11vmin,64px);letter-spacing:.25em;font-weight:700;color:#e6e8ee;text-shadow:0 0 18px rgba(200,210,230,.25)}
#title .titleimg{max-width:80vw;max-height:40vh}
html[lang=en] #title{font-weight:400}
#subtitle{font-family:"NK Garamond","NK Mincho",serif;font-size:min(4vmin,20px);letter-spacing:.12em;color:#9aa0ad;text-align:center;padding:0 6vw}
#pause{position:fixed;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));width:44px;height:44px;border:0;background:transparent;opacity:.35;z-index:4;padding:0;cursor:pointer}
#pause svg{width:100%;height:100%}
#paused{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.7);z-index:7;cursor:pointer}
#paused > svg{margin-bottom:12vh}
#paused.show{display:flex}
#paused svg{width:min(22vmin,120px);height:min(22vmin,120px);opacity:.8}
#muted{position:fixed;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));width:40px;height:40px;display:none;opacity:.6;z-index:4}
#muted.show{display:block}
#sub{position:fixed;pointer-events:none;opacity:0;color:#e4e6ec;text-shadow:0 0 6px rgba(0,0,0,.9),0 0 14px rgba(170,180,200,.25);z-index:3;line-height:1.7;letter-spacing:.08em}
/* ja: vertical; columns 1.8em apart, letters .08em; a column may only break between pieces (the '|' marks), never inside */
#sub.ja{writing-mode:vertical-rl;right:max(8vw,env(safe-area-inset-right));top:10vh;font-size:max(20px,min(4.6vmin,30px));line-height:1.8;
  font-feature-settings:"vert" 1,"vrt2" 1;max-height:calc(90vh - var(--hb-ja) - var(--ic) - var(--lab) - 12px);word-break:keep-all;line-break:strict}
#sub .seg{white-space:nowrap}
#sub .seg.long{white-space:normal}
#sub .ch{display:inline}
#sub .ch.gx{opacity:.45;text-shadow:1px -1px 0 rgba(200,210,230,.35)}
#sub.en{left:50%;transform:translateX(-50%);bottom:var(--sub-en-bottom);width:min(86vw,720px);text-align:center;font-size:var(--enfs);letter-spacing:.02em;line-height:1.65;word-break:normal}
/* control pictures (art/ui, 256 px drawn at 48-64 px); row at the bottom. ja column and en band both sit above it (P0.2-1) */
#howto{position:fixed;left:max(16px,4vw,env(safe-area-inset-left));right:max(16px,4vw,env(safe-area-inset-right));bottom:var(--hb-ja);height:var(--howto-h);pointer-events:none;z-index:3;display:none;justify-content:space-between;align-items:flex-end;gap:6px}
#howto.show{display:flex}
#howto .hi{flex:0 1 auto;width:min(max(calc(var(--ic) * 1.9),96px),calc((100% - 18px) / 4));min-width:var(--ic);display:flex;flex-direction:column;align-items:center;opacity:.8;transition:opacity .8s}
#howto .hi.used{opacity:0}
#howto .hi img{width:var(--ic);height:var(--ic);flex:none;display:block}
#howto .hl{font-size:var(--labfs);line-height:1.3;color:#cfd3dc;text-align:center;max-height:2.6em;overflow:hidden}
#howto .hi-move{order:1}
#howto .hi-release{order:2}
#howto .hi-tap{order:3}
#howto .hi-hold{order:4}
/* prologue overlay: text/choices/title sit above a black (or panned) canvas */
#pro{position:fixed;inset:0;z-index:6;display:none}
#pro.on{display:block}
#protitlewrap{position:absolute;left:50%;top:28%;transform:translate(-50%,-50%);max-width:74vw;pointer-events:none;opacity:0;z-index:5;display:flex;align-items:center;justify-content:center}
#protitlewrap.wide{top:15%}
#protitlewrap::before{content:"";position:absolute;inset:-18% -22%;background:radial-gradient(ellipse at center,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 70%);z-index:-1}
#protitlewrap img{display:block;max-width:74vw;max-height:24vh;height:auto;filter:drop-shadow(0 0 10px rgba(0,0,0,.7))}
#prochoices{position:absolute;left:50%;bottom:max(16vh,env(safe-area-inset-bottom) + 72px);transform:translateX(-50%);display:none;flex-direction:column;gap:10px;width:min(84vw,420px);z-index:6}
#prochoices.on{display:flex}
#prochoices button{appearance:none;font:inherit;font-size:max(16px,min(3.6vmin,22px));letter-spacing:.08em;color:#e4e6ec;background:rgba(0,0,0,.45);border:1px solid rgba(200,210,230,.28);border-radius:4px;padding:.7em 1em;cursor:pointer;text-align:center;line-height:1.5}
#prochoices button:hover,#prochoices button:focus{border-color:rgba(200,210,230,.6);background:rgba(0,0,0,.6)}
html[lang=en] #prochoices button{font-family:"NK Garamond","NK Mincho",serif;letter-spacing:.03em}
#pronext,#proskip{appearance:none;background:transparent;border:0;color:#cfd3dc;padding:0;cursor:pointer;z-index:6;opacity:.45}
#pronext{position:absolute;left:50%;bottom:max(20px,4vh,env(safe-area-inset-bottom));transform:translateX(-50%);width:52px;height:52px;display:none}
#pronext.on{display:block}
#pronext svg,#proskip svg{width:100%;height:100%;display:block}
#proskip{position:absolute;right:max(58px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));width:36px;height:36px}
#pronext:hover,#proskip:hover{opacity:.85}
/* during the inn scene, keep English subtitles above the choice row */
#sub.en.pro-inn{bottom:calc(max(16vh, env(safe-area-inset-bottom) + 72px) + 8.5em)}
/*@TEST*/
#testhud{display:none;position:fixed;left:50%;transform:translateX(-50%);top:max(6px,env(safe-area-inset-top));font:11px/1 monospace;color:#7c8a7c;z-index:7;pointer-events:none;align-items:center;gap:6px}
#testhud.on{display:flex}
#testdot{width:8px;height:8px;border-radius:50%;background:#553}
#testdot.ready{background:#3a6}
#testdot.flash{background:#fff;box-shadow:0 0 6px #fff}
#testlog{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#000;z-index:8;font:14px/1.5 monospace;color:#cfd3dc}
#testlog.show{display:flex}
#testlog pre{margin:0;padding:12px 16px;border:1px solid #333;max-width:92vw;white-space:pre-wrap;word-break:break-all;-webkit-user-select:text;user-select:text}
#testlog button{font:15px sans-serif;padding:10px 20px;background:#111;color:#e6e8ee;border:1px solid #555;border-radius:6px}
/*@END_TEST*/
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="start" data-state="main">
  <div id="startbg"></div><div id="startshade"></div><div id="oripple"></div>
  <div id="stitle">
    <div id="title">Narukami Hall</div>
    <div id="subtitle">Ring Once, Then Listen</div>
    <div id="titlealt"></div>
    <div id="genre"></div>
  </div>
  <div id="smenu">
    <button type="button" class="sbtn" id="btn-new">New Game</button>
    <button type="button" class="sbtn off" id="btn-cont" disabled>Continue</button>
  </div>
  <div id="diffsel">
    <div id="diffhead"></div>
    <button type="button" class="sbtn dbtn" id="diff-easy"><span class="dl" id="diff-easy-l">Easy</span><span class="dd" id="diff-easy-d"></span></button>
    <button type="button" class="sbtn dbtn" id="diff-normal"><span class="dl" id="diff-normal-l">Normal</span><span class="dd" id="diff-normal-d"></span></button>
    <button type="button" class="sbtn dbtn" id="diff-hard"><span class="dl" id="diff-hard-l">Hard</span><span class="dd" id="diff-hard-d"></span></button>
    <div id="hardnote"><svg viewBox="0 0 64 64" fill="none" stroke="#e4e6ec" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M14 38v-6a18 18 0 0 1 36 0v6"/><rect x="9" y="36" width="9" height="16" rx="4"/><rect x="46" y="36" width="9" height="16" rx="4"/></svg><span id="hardnotetext"></span></div>
  </div>
  <div id="phones"><svg viewBox="0 0 64 64" fill="none" stroke="#cfd3dc" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M14 38v-6a18 18 0 0 1 36 0v6"/><rect x="9" y="36" width="9" height="16" rx="4"/><rect x="46" y="36" width="9" height="16" rx="4"/></svg><span id="phonestext">Headphones recommended</span></div>
  <div id="credit">
    <div class="cline" id="credit-voice">VOICEVOX:玄野武宏(CV:ガロ)</div>
    <div class="cline" id="credit-art">Art: Created with Grok</div>
    <button type="button" id="btn-credits">Credits</button>
  </div>
</div>
<div id="credits" role="dialog"><div><div id="creditslist"></div><div id="creditsclose"></div></div></div>
<div id="bellui" aria-hidden="true"><svg viewBox="0 0 44 44" fill="none" stroke="#cfd3dc" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <path d="M22 9c-5.5 0-8.5 4.2-8.5 9.5v5.5l-3 5h23l-3-5v-5.5C30.5 13.2 27.5 9 22 9z"/><path d="M22 6v3"/><circle cx="22" cy="32" r="2"/>
  <path class="sr" d="M7 14a17 17 0 0 0 0 16M37 14a17 17 0 0 1 0 16" stroke-width="1.4"/>
  <path class="ck1" d="M20 12l2.5 4-2 3 2.5 3.5" stroke-width="1.3"/>
  <path class="ck2" d="M27 17l-2.5 3.2 2 2.6-1.8 3.4" stroke-width="1.3"/>
  <path class="ck3" d="M15.5 21l3 1.6-1 2.6 2.6 2.4M22 22.5l1.2 3.2-1.6 2" stroke-width="1.3"/>
</svg></div>
<button id="pause" aria-label="pause"><svg viewBox="0 0 44 44" fill="#cfd3dc"><rect x="13" y="11" width="6" height="22" rx="2"/><rect x="25" y="11" width="6" height="22" rx="2"/></svg></button>
<div id="paused" aria-label="resume"><svg viewBox="0 0 64 64" fill="none" stroke="#cfd3dc" stroke-width="2.5" stroke-linejoin="round"><path d="M24 16l24 16-24 16z"/></svg>
  <div id="pausediff"><div id="pausediffhead"></div><div class="row"><button type="button" class="sbtn" id="pdiff-easy">Easy</button><button type="button" class="sbtn" id="pdiff-normal">Normal</button><button type="button" class="sbtn" id="pdiff-hard">Hard</button></div></div>
</div>
<svg id="muted" viewBox="0 0 40 40" fill="none" stroke="#cfd3dc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 16h6l8-6v20l-8-6H8z"/><path d="M28 15l8 10M36 15l-8 10"/></svg>
<div id="howto" aria-hidden="true"></div>
<div id="sub" aria-live="polite"></div>
<div id="pro" aria-hidden="true">
  <div id="protitlewrap"><img id="protitle" alt=""></div>
  <div id="prochoices"></div>
  <button type="button" id="pronext" aria-label="continue"><svg viewBox="0 0 52 52" fill="none" stroke="#cfd3dc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 14l16 12-16 12"/></svg></button>
  <button type="button" id="proskip" aria-label="skip"><svg viewBox="0 0 36 36" fill="none" stroke="#cfd3dc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 12l10 6-10 6V12z"/><path d="M22 12l10 6-10 6V12z"/></svg></button>
</div>
<!--@TEST-->
<div id="testhud">fps<span id="testdot"></span></div>
<div id="testlog"><pre id="testlogtext"></pre><div><button id="testcopy">copy</button> <button id="testagain">again</button></div></div>
<!--@END_TEST-->
<script src="nk.js"></script>
</body>
</html>
